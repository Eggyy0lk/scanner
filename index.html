<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Pass Scanner & Redeemer</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.88);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-border: #10b981;
            --success-text: #34d399;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-border: #ef4444;
            --error-text: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.4);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 16px;
        }

        h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.4; }

        .tab-group {
            display: flex;
            gap: 4px;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            font-size: 0.8rem;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .mode-section { display: none; margin-bottom: 20px; }
        .mode-section.active { display: block; }

        .scanner-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border-color);
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #reader { width: 100%; }

        .upload-box {
            display: block;
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 36px 20px;
            background: rgba(15, 23, 42, 0.5);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
        }

        .upload-icon { font-size: 2.5rem; margin-bottom: 12px; display: block; }
        .upload-text { font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; }
        .upload-text strong { color: var(--primary); }

        input[type="file"] { display: none; }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            color: #ffffff;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            margin-bottom: 12px;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background-color: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background-color: var(--primary-hover); }

        .status-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }

        .status-box.success {
            display: block;
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .status-box.error {
            display: block;
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        .details-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .count-highlight { color: var(--text-main); font-weight: 700; }

        .reset-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="badge">Official Redemption</div>
    <h1>Promo Pass Redeemer</h1>
    <p class="subtitle">Scan a QR code, upload an image pass, or manually enter your code/barcode number.</p>

    <div class="tab-group">
        <button class="tab-btn active" onclick="switchTab('camera')">📷 Live Scan</button>
        <button class="tab-btn" onclick="switchTab('upload')">📁 Upload QR</button>
        <button class="tab-btn" onclick="switchTab('manual')">⌨️ Manual Entry</button>
    </div>

    <div id="cameraSection" class="mode-section active">
        <div class="scanner-wrapper">
            <div id="reader"></div>
        </div>
        <button class="btn" style="margin-top: 12px;" onclick="toggleCamera()">Toggle Camera</button>
    </div>

    <div id="uploadSection" class="mode-section">
        <label for="qrFileInput" class="upload-box">
            <span class="upload-icon">🖼️</span>
            <div class="upload-text">
                <strong>Click to select an image file</strong><br>
                Supports QR codes & Barcode images
            </div>
        </label>
        <input type="file" id="qrFileInput" accept="image/*" onchange="handleFileUpload(event)">
    </div>

    <div id="manualSection" class="mode-section">
        <input type="text" id="couponInput" placeholder="ENTER CODE OR BARCODE #" maxlength="30">
        <button class="btn" onclick="applyCoupon(document.getElementById('couponInput').value)">Redeem Code</button>
    </div>

    <div id="statusMessage" class="status-box"></div>

    <div class="details-footer">
        <span>Expires: <strong style="color: #cbd5e1;">Jan 28, 2027</strong></span>
        <span>Uses Left: <span id="usesLeft" class="count-highlight">10</span> / 10</span>
    </div>

    <button class="reset-btn" onclick="resetUsageCount()">Reset Counter (Testing)</button>
</div>

<script>
    const TARGET_CODE = "PROMO2027";
    const MAX_USES = 10;
    const EXPIRY_DATE = new Date("2027-01-28T23:59:59");

    let html5QrCode = null;
    let cameraIsRunning = false;
    let usesCount = parseInt(localStorage.getItem("couponUsageCount") || "0", 10);

    updateDisplay();
    startCameraScanner();

    function updateDisplay() {
        const remaining = Math.max(0, MAX_USES - usesCount);
        document.getElementById("usesLeft").innerText = remaining;
    }

    function switchTab(mode) {
        const tabs = document.querySelectorAll('.tab-btn');
        const sections = document.querySelectorAll('.mode-section');

        tabs.forEach(t => t.classList.remove('active'));
        sections.forEach(s => s.classList.remove('active'));

        if (mode === 'camera') {
            tabs[0].classList.add('active');
            document.getElementById('cameraSection').classList.add('active');
            startCameraScanner();
        } else if (mode === 'upload') {
            tabs[1].classList.add('active');
            document.getElementById('uploadSection').classList.add('active');
            stopCameraScanner();
        } else {
            tabs[2].classList.add('active');
            document.getElementById('manualSection').classList.add('active');
            stopCameraScanner();
        }
    }

    async function startCameraScanner() {
        if (cameraIsRunning) return;
        try {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            await html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                onScanSuccess,
                () => {} // Scan error loop callback ignored
            );
            cameraIsRunning = true;
        } catch (err) {
            showStatus("Camera access permission denied or unavailable.", false);
        }
    }

    async function stopCameraScanner() {
        if (html5QrCode && cameraIsRunning) {
            try {
                await html5QrCode.stop();
                cameraIsRunning = false;
            } catch (err) {
                console.error("Failed to stop scanner:", err);
            }
        }
    }

    async function toggleCamera() {
        if (cameraIsRunning) {
            await stopCameraScanner();
            showStatus("Camera paused.", false);
        } else {
            await startCameraScanner();
        }
    }

    function onScanSuccess(decodedText) {
        applyCoupon(decodedText);
    }

    async function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        try {
            const tempScanner = new Html5Qrcode("reader");
            const decodedText = await tempScanner.scanFile(file, true);
            applyCoupon(decodedText);
        } catch (err) {
            showStatus("No readable QR code or barcode detected in image.", false);
        } finally {
            event.target.value = "";
        }
    }

    function applyCoupon(rawInput) {
        const input = (rawInput || "").trim().toUpperCase();
        const now = new Date();

        if (!input) {
            showStatus("Please enter or scan a code.", false);
            return;
        }

        if (input !== TARGET_CODE) {
            showStatus(`Invalid code "${input}". Expected code: PROMO2027`, false);
            return;
        }

        if (now > EXPIRY_DATE) {
            showStatus("This coupon expired on January 28, 2027.", false);
            return;
        }

        if (usesCount >= MAX_USES) {
            showStatus("Coupon limit reached (10/10 uses claimed).", false);
            return;
        }

        usesCount++;
        localStorage.setItem("couponUsageCount", usesCount);
        updateDisplay();

        showStatus("🎉 Coupon successfully validated and redeemed!", true);
    }

    function showStatus(text, isSuccess) {
        const message = document.getElementById("statusMessage");
        message.className = `status-box ${isSuccess ? 'success' : 'error'}`;
        message.innerText = text;
    }

    function resetUsageCount() {
        usesCount = 0;
        localStorage.setItem("couponUsageCount", "0");
        updateDisplay();
        showStatus("Usage counter reset to 0 for testing.", true);
    }
</script>

</body>
</html>
