<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Promo Scanner & Redeemer</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-border: #10b981;
            --success-text: #34d399;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-border: #ef4444;
            --error-text: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.4);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .tab-group {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .scanner-container {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            min-height: 250px;
        }

        #reader {
            width: 100%;
            border: none !important;
        }

        #reader video {
            object-fit: cover !important;
            border-radius: 14px;
        }

        .manual-input-box {
            display: none;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            color: #ffffff;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background-color: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .status-box {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }

        .status-box.success {
            display: block;
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .status-box.error {
            display: block;
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        .details-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .count-highlight {
            color: var(--text-main);
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="badge">Official Redemption</div>
    <h1>Promo Pass Scanner</h1>
    <p class="subtitle">Scan a pass QR code or enter your code manually below.</p>

    <div class="tab-group">
        <button class="tab-btn active" onclick="switchMode('camera')">📷 Camera Scan</button>
        <button class="tab-btn" onclick="switchMode('manual')">⌨️ Manual Code</button>
    </div>

    <div id="cameraMode">
        <div class="scanner-container">
            <div id="reader"></div>
        </div>
    </div>

    <div id="manualMode" class="manual-input-box">
        <input type="text" id="couponInput" placeholder="ENTER CODE" maxlength="20">
        <button class="submit-btn" onclick="applyCoupon(document.getElementById('couponInput').value)">Redeem Code</button>
    </div>

    <div id="statusMessage" class="status-box"></div>

    <div class="details-footer">
        <span>Expires: <strong style="color: #cbd5e1;">Jan 28, 2027</strong></span>
        <span>Uses Left: <span id="usesLeft" class="count-highlight">10</span> / 10</span>
    </div>
</div>

<script>
    const TARGET_CODE = "PROMO2027";
    const MAX_USES = 10;
    const EXPIRY_DATE = new Date("2027-01-28T23:59:59");
    
    let html5QrcodeScanner = null;
    let usesCount = parseInt(localStorage.getItem("couponUsageCount") || "0", 10);

    updateDisplay();
    initScanner();

    function updateDisplay() {
        const remaining = Math.max(0, MAX_USES - usesCount);
        document.getElementById("usesLeft").innerText = remaining;
    }

    function switchMode(mode) {
        const tabs = document.querySelectorAll('.tab-btn');
        const cameraMode = document.getElementById('cameraMode');
        const manualMode = document.getElementById('manualMode');
        
        if (mode === 'camera') {
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
            cameraMode.style.display = 'block';
            manualMode.style.display = 'none';
            if (!html5QrcodeScanner) initScanner();
        } else {
            tabs[1].classList.add('active');
            tabs[0].classList.remove('active');
            cameraMode.style.display = 'none';
            manualMode.style.display = 'block';
            stopScanner();
        }
    }

    function initScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: { width: 200, height: 200 },
            aspectRatio: 1.0
        }, false);
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function stopScanner() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.clear().catch(err => console.error(err));
            html5QrcodeScanner = null;
        }
    }

    function onScanSuccess(decodedText) {
        applyCoupon(decodedText);
    }

    function onScanFailure(error) {
        // Scanning frame update loop
    }

    function applyCoupon(rawInput) {
        const input = (rawInput || "").trim().toUpperCase();
        const message = document.getElementById("statusMessage");
        const now = new Date();

        message.className = "status-box";

        if (!input) {
            message.classList.add("error");
            message.innerText = "Please enter or scan a code.";
            return;
        }

        if (input !== TARGET_CODE) {
            message.classList.add("error");
            message.innerText = `Invalid Code "${input}". Please try again.`;
            return;
        }

        if (now > EXPIRY_DATE) {
            message.classList.add("error");
            message.innerText = "This coupon expired on January 28, 2027.";
            return;
        }

        if (usesCount >= MAX_USES) {
            message.classList.add("error");
            message.innerText = "Coupon usage limit reached (10/10 uses).";
            return;
        }

        usesCount++;
        localStorage.setItem("couponUsageCount", usesCount);
        updateDisplay();

        message.classList.add("success");
        message.innerText = "🎉 Coupon successfully redeemed!";
    }
</script>

</body>
</html>
