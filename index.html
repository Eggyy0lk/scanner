<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Verification Portal</title>
    <!-- Include HTML5 QR Code Scanner Library -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #ca8a04;
            --danger: #dc2626;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            margin: 0 0 8px 0;
            color: #0f172a;
        }

        .header p {
            font-size: 14px;
            color: #64748b;
            margin: 0;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: none !important;
            background: #f1f5f9;
        }

        #reader __video {
            object-fit: cover;
        }

        .result-card {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            background: #f1f5f9;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-status {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-valid { color: var(--success); }
        .status-invalid { color: var(--danger); }

        .ticket-info {
            font-size: 14px;
            color: #475569;
            line-height: 1.5;
        }

        .count-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            background: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Pass Verification Terminal</h1>
        <p>Scan a ticket QR code to validate and update usage</p>
    </div>

    <!-- Scanner Interface Element -->
    <div id="reader"></div>

    <!-- Result Display Element -->
    <div id="resultCard" class="result-card">
        <div id="resultStatus" class="result-status"></div>
        <div id="ticketInfo" class="ticket-info"></div>
    </div>
</div>

<script>
    // Local database simulation using LocalStorage
    // In production, this logic belongs on a secure backend server.
    function processTicketScan(ticketId) {
        const maxUses = 10;
        let currentUses = localStorage.getItem(ticketId);

        // If the ticket code hasn't been scanned before, initialize it at 10
        if (currentUses === null) {
            currentUses = maxUses;
        } else {
            currentUses = parseInt(currentUses, 10);
        }

        const resultCard = document.getElementById('resultCard');
        const resultStatus = document.getElementById('resultStatus');
        const ticketInfo = document.getElementById('ticketInfo');

        resultCard.style.display = 'block';

        if (currentUses > 0) {
            // Decrement the count
            currentUses -= 1;
            localStorage.setItem(ticketId, currentUses);

            // Update UI for successful scan
            resultStatus.className = 'result-status status-valid';
            resultStatus.innerText = '✓ Pass Validated';
            ticketInfo.innerHTML = `
                <p><strong>Ticket ID:</strong> <code>${ticketId}</code></p>
                <p><strong>Action:</strong> 1 use deducted.</p>
                <p><strong>Remaining Uses:</strong> <span class="count-badge">${currentUses} / ${maxUses}</span></p>
            `;
        } else {
            // Update UI for exhausted ticket
            resultStatus.className = 'result-status status-invalid';
            resultStatus.innerText = '✗ Access Denied';
            ticketInfo.innerHTML = `
                <p><strong>Ticket ID:</strong> <code>${ticketId}</code></p>
                <p style="color: var(--danger);"><strong>Error:</strong> This pass has 0 remaining uses.</p>
            `;
        }
    }

    // Initialize the QR Code Scanner
    function onScanSuccess(decodedText, decodedResult) {
        // Pause scanning briefly to prevent rapid duplicate scans of the same code
        html5QrcodeScanner.clear();
        
        // Process the scanned payload
        processTicketScan(decodedText);

        // Restart scanner after 3 seconds to allow the next scan
        setTimeout(() => {
            startScanner();
        }, 3000);
    }

    function onScanFailure(error) {
        // Silent failure is standard to avoid console flooding during continuous video parsing
    }

    function startScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: {width: 250, height: 250} },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    let html5QrcodeScanner;
    // Launch the scanner on page load
    window.addEventListener('DOMContentLoaded', startScanner);
</script>

</body>
</html>
