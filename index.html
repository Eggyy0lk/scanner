<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Pass Scanner & Redeemer</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.88);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-border: #10b981;
            --success-text: #34d399;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-border: #ef4444;
            --error-text: #f87171;
            --info-bg: rgba(99, 102, 241, 0.15);
            --info-border: #6366f1;
            --info-text: #a5b4fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.4);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 16px;
        }

        h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.4; }

        .registered-code {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 18px;
            font-size: 0.82rem;
            color: var(--info-text);
        }

        .registered-code.visible { display: flex; }
        .registered-code .code-label { color: var(--text-muted); font-size: 0.75rem; }
        .registered-code .code-value {
            font-weight: 800;
            letter-spacing: 0.06em;
            color: #c7d2fe;
            font-size: 0.9rem;
        }

        .clear-code-btn {
            margin-left: auto;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-code-btn:hover { background: rgba(239, 68, 68, 0.35); }

        .tab-group {
            display: flex;
            gap: 4px;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            font-size: 0.8rem;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .mode-section { display: none; margin-bottom: 20px; }
        .mode-section.active { display: block; }

        .scanner-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border-color);
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #reader { width: 100%; }

        .upload-box {
            display: block;
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 36px 20px;
            background: rgba(15, 23, 42, 0.5);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
        }

        .upload-icon { font-size: 2.5rem; margin-bottom: 12px; display: block; }
        .upload-text { font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; }
        .upload-text strong { color: var(--primary); }

        input[type="file"] { display: none; }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            color: #ffffff;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            margin-bottom: 12px;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background-color: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
            text-align: left;
            line-height: 1.4;
        }

        .status-box.success {
            display: block;
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .status-box.error {
            display: block;
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        .status-box.info {
            display: block;
            background-color: var(--info-bg);
            color: var(--info-text);
            border: 1px solid var(--info-border);
        }

        .details-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .count-highlight { color: var(--text-main); font-weight: 700; }

        .progress-wrap {
            margin-top: 14px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 99px;
            height: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, #6366f1, #818cf8);
            transition: width 0.4s ease;
        }

        .progress-bar.depleted { background: linear-gradient(90deg, #ef4444, #f87171); }

        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            flex-direction: column;
            gap: 12px;
        }

        .loading-overlay.visible { display: flex; }

        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .reset-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 12px;
        }

        .cloud-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .cloud-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .cloud-dot.connected { background: #10b981; }
        .cloud-dot.error { background: #ef4444; }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <span id="loadingText">Connecting to database...</span>
</div>

<div class="card">
    <div class="badge">Official Redemption</div>
    <h1>Promo Pass Redeemer</h1>
    <p class="subtitle">Scan a QR code, upload an image pass, or manually enter your code. The first code scanned becomes the registered pass — synced across all devices.</p>

    <div class="cloud-indicator">
        <div class="cloud-dot" id="cloudDot"></div>
        <span id="cloudStatus">Connecting to cloud...</span>
    </div>

    <div class="registered-code" id="registeredCodePill">
        <div>
            <div class="code-label">Registered Code</div>
            <div class="code-value" id="registeredCodeValue">—</div>
        </div>
        <button class="clear-code-btn" onclick="clearRegisteredCode()">✕ Clear</button>
    </div>

    <div class="tab-group">
        <button class="tab-btn active" onclick="switchTab('camera')">📷 Live Scan</button>
        <button class="tab-btn" onclick="switchTab('upload')">📁 Upload QR</button>
        <button class="tab-btn" onclick="switchTab('manual')">⌨️ Manual Entry</button>
    </div>

    <div id="cameraSection" class="mode-section active">
        <div class="scanner-wrapper">
            <div id="reader"></div>
        </div>
        <button class="btn" style="margin-top: 12px;" onclick="toggleCamera()">Toggle Camera</button>
    </div>

    <div id="uploadSection" class="mode-section">
        <label for="qrFileInput" class="upload-box">
            <span class="upload-icon">🖼️</span>
            <div class="upload-text">
                <strong>Click to select an image file</strong><br>
                Supports QR codes &amp; Barcode images
            </div>
        </label>
        <input type="file" id="qrFileInput" accept="image/*" onchange="handleFileUpload(event)">
    </div>

    <div id="manualSection" class="mode-section">
        <input type="text" id="couponInput" placeholder="ENTER CODE OR BARCODE #" maxlength="100">
        <button class="btn" id="redeemBtn" onclick="applyCoupon(document.getElementById('couponInput').value)">Redeem Code</button>
    </div>

    <div id="statusMessage" class="status-box"></div>

    <div class="details-footer">
        <span>Expires: <strong style="color: #cbd5e1;">Jan 28, 2027</strong></span>
        <span>Uses Left: <span id="usesLeft" class="count-highlight">—</span> / <span id="maxUsesDisplay">10</span></span>
    </div>

    <div class="progress-wrap">
        <div class="progress-bar" id="progressBar" style="width: 100%;"></div>
    </div>

    <button class="reset-btn" onclick="resetAll()">Reset Everything (Testing)</button>
</div>

<!-- Firebase SDKs (CDN, no npm needed) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot }
        from "https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js";

    // ── Your Firebase config ──────────────────────────────────────────────────
    const firebaseConfig = {
        apiKey: "AIzaSyCylGg-vfUJ1EwF_1tRkH5L0mju34OUSFw",
        authDomain: "scanner-d2558.firebaseapp.com",
        projectId: "scanner-d2558",
        storageBucket: "scanner-d2558.firebasestorage.app",
        messagingSenderId: "543140601074",
        appId: "1:543140601074:web:7e8ef41df74c465a35846b",
        measurementId: "G-VEPHLRECRZ"
    };

    const MAX_USES     = 50;
    const EXPIRY_DATE  = new Date("2027-01-28T23:59:59");
    const DOC_PATH     = "promos/mainPass";   // Firestore document

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const passRef = doc(db, "promos", "mainPass");

    // Local state (mirrors Firestore)
    let targetCode = null;
    let usesCount  = 0;
    let dbReady    = false;

    // Debounce for live camera
    let lastScanTime = 0;
    const SCAN_DEBOUNCE_MS = 2500;

    // QR scanner
    let html5QrCode    = null;
    let cameraIsRunning = false;

    // ── Cloud status indicator ────────────────────────────────────────────────
    function setCloudStatus(state) {
        const dot  = document.getElementById("cloudDot");
        const text = document.getElementById("cloudStatus");
        dot.className = "cloud-dot";
        if (state === "connected") {
            dot.classList.add("connected");
            text.textContent = "Synced to cloud";
        } else if (state === "error") {
            dot.classList.add("error");
            text.textContent = "Cloud connection failed";
        } else {
            text.textContent = "Connecting to cloud...";
        }
    }

    // ── Loading overlay ───────────────────────────────────────────────────────
    function showLoading(msg) {
        document.getElementById("loadingText").textContent = msg || "Please wait...";
        document.getElementById("loadingOverlay").classList.add("visible");
    }

    function hideLoading() {
        document.getElementById("loadingOverlay").classList.remove("visible");
    }

    // ── Display ───────────────────────────────────────────────────────────────
    function updateDisplay() {
        const remaining = Math.max(0, MAX_USES - usesCount);
        document.getElementById("usesLeft").innerText = remaining;
        document.getElementById("maxUsesDisplay").innerText = MAX_USES;

        const pct = (remaining / MAX_USES) * 100;
        const bar = document.getElementById("progressBar");
        bar.style.width = pct + "%";
        bar.classList.toggle("depleted", remaining === 0);

        const pill = document.getElementById("registeredCodePill");
        const val  = document.getElementById("registeredCodeValue");
        if (targetCode) {
            pill.classList.add("visible");
            val.innerText = targetCode;
        } else {
            pill.classList.remove("visible");
            val.innerText = "—";
        }
    }

    function showStatus(text, type = "error") {
        const el = document.getElementById("statusMessage");
        el.className = `status-box ${type}`;
        el.innerText = text;
    }

    // ── Firestore: real-time listener ─────────────────────────────────────────
    showLoading("Connecting to database...");

    onSnapshot(passRef, (snap) => {
        if (snap.exists()) {
            const data = snap.data();
            targetCode = data.targetCode || null;
            usesCount  = data.usesCount  || 0;
        } else {
            targetCode = null;
            usesCount  = 0;
        }
        dbReady = true;
        updateDisplay();
        setCloudStatus("connected");
        hideLoading();
    }, (err) => {
        console.error("Firestore error:", err);
        setCloudStatus("error");
        showStatus("Could not connect to cloud database. Check your internet connection.", "error");
        hideLoading();
    });

    // ── Core redemption logic ─────────────────────────────────────────────────
    async function applyCoupon(rawInput) {
        if (!dbReady) { showStatus("Still connecting to database, please wait.", "info"); return; }

        const input = (rawInput || "").trim();
        if (!input) { showStatus("Please enter or scan a code.", "error"); return; }

        const now = new Date();
        if (now > EXPIRY_DATE) { showStatus("This pass expired on January 28, 2027.", "error"); return; }

        showLoading("Checking code...");

        try {
            // Re-fetch fresh data to avoid race conditions across devices
            const freshSnap = await getDoc(passRef);
            const freshData = freshSnap.exists() ? freshSnap.data() : {};
            const freshCode  = freshData.targetCode || null;
            const freshUses  = freshData.usesCount  || 0;

            // 1. No code registered yet — register this one
            if (!freshCode) {
                await setDoc(passRef, { targetCode: input, usesCount: 0 });
                hideLoading();
                showStatus(`✅ Code registered: "${input}"\nScan it again to start redeeming uses.`, "info");
                return;
            }

            // 2. Wrong code
            if (input !== freshCode) {
                hideLoading();
                showStatus("Wrong code. This pass is locked to a different registered code.", "error");
                return;
            }

            // 3. All uses gone
            if (freshUses >= MAX_USES) {
                hideLoading();
                showStatus("All 10 uses have been claimed for this pass.", "error");
                return;
            }

            // 4. Success — increment in Firestore
            const newUses = freshUses + 1;
            await updateDoc(passRef, { usesCount: newUses });

            hideLoading();
            const remaining = MAX_USES - newUses;
            if (remaining === 0) {
                showStatus(`🎉 Use ${newUses}/${MAX_USES} redeemed. Pass fully used — no uses remaining.`, "success");
            } else {
                showStatus(`🎉 Use ${newUses}/${MAX_USES} redeemed. ${remaining} use${remaining !== 1 ? "s" : ""} left.`, "success");
            }

        } catch (err) {
            hideLoading();
            console.error("Redemption error:", err);
            showStatus("A network error occurred. Please try again.", "error");
        }
    }

    // ── Clear / reset ─────────────────────────────────────────────────────────
    async function clearRegisteredCode() {
        if (!confirm("Clear the registered code? This also resets the use count.")) return;
        showLoading("Clearing...");
        try {
            await setDoc(passRef, { targetCode: null, usesCount: 0 });
            hideLoading();
            showStatus("Registered code cleared. Scan a new QR code to register it.", "info");
        } catch (err) {
            hideLoading();
            showStatus("Failed to clear. Check your connection.", "error");
        }
    }

    async function resetAll() {
        showLoading("Resetting...");
        try {
            await setDoc(passRef, { targetCode: null, usesCount: 0 });
            hideLoading();
            showStatus("Everything reset. Scan any code to register it as the new pass.", "info");
        } catch (err) {
            hideLoading();
            showStatus("Failed to reset. Check your connection.", "error");
        }
    }

    // ── Tab switching ─────────────────────────────────────────────────────────
    function switchTab(mode) {
        const tabs     = document.querySelectorAll('.tab-btn');
        const sections = document.querySelectorAll('.mode-section');
        tabs.forEach(t => t.classList.remove('active'));
        sections.forEach(s => s.classList.remove('active'));

        if (mode === 'camera') {
            tabs[0].classList.add('active');
            document.getElementById('cameraSection').classList.add('active');
            startCameraScanner();
        } else if (mode === 'upload') {
            tabs[1].classList.add('active');
            document.getElementById('uploadSection').classList.add('active');
            stopCameraScanner();
        } else {
            tabs[2].classList.add('active');
            document.getElementById('manualSection').classList.add('active');
            stopCameraScanner();
        }
    }

    // ── Camera scanner ────────────────────────────────────────────────────────
    async function startCameraScanner() {
        if (cameraIsRunning) return;
        try {
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            await html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => {
                    const now = Date.now();
                    if (now - lastScanTime < SCAN_DEBOUNCE_MS) return;
                    lastScanTime = now;
                    applyCoupon(decodedText);
                },
                () => {}
            );
            cameraIsRunning = true;
        } catch (err) {
            showStatus("Camera access denied or unavailable.", "error");
        }
    }

    async function stopCameraScanner() {
        if (html5QrCode && cameraIsRunning) {
            try { await html5QrCode.stop(); cameraIsRunning = false; }
            catch (err) { console.error(err); }
        }
    }

    async function toggleCamera() {
        if (cameraIsRunning) { await stopCameraScanner(); showStatus("Camera paused.", "info"); }
        else { await startCameraScanner(); }
    }

    // ── File upload ───────────────────────────────────────────────────────────
    async function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        try {
            const tempDiv = document.createElement("div");
            tempDiv.id = "__tempQrReader__";
            tempDiv.style.display = "none";
            document.body.appendChild(tempDiv);
            const tempScanner = new Html5Qrcode("__tempQrReader__");
            const decodedText = await tempScanner.scanFile(file, true);
            document.body.removeChild(tempDiv);
            applyCoupon(decodedText);
        } catch (err) {
            showStatus("No readable QR code or barcode detected in the image.", "error");
        } finally {
            event.target.value = "";
        }
    }

    // ── Expose functions to global scope for onclick handlers ─────────────────
    window.switchTab         = switchTab;
    window.toggleCamera      = toggleCamera;
    window.handleFileUpload  = handleFileUpload;
    window.applyCoupon       = applyCoupon;
    window.clearRegisteredCode = clearRegisteredCode;
    window.resetAll          = resetAll;

    // ── Boot ──────────────────────────────────────────────────────────────────
    startCameraScanner();
</script>

</body>
</html>
